<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" /> <!-- link para icone do google -->
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p><ins>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</ins></p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <label for="iemail"><span class="material-symbols-outlined">person</span> <!-- icone do google --></label>
                        <input type="email" name="email" class="forma" id="iemail" placeholder="seu e-mail" autocomplete="email" required maxlength="30">
                        
                    </div>
                    <div class="campo">
                        <label for="isenha"><span class="material-symbols-outlined">vpn_key</span> <!-- icone do google --></label>
                        <input type="password" class="forma" name="Senha" id="isenha" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                        
                    </div>
                    <input class="botao" type="submit" value="Entrar">
                    <a class="botao"  href="#">Esqueci a senha <span class="material-symbols-outlined">mail</span></a> <!-- botão para esquecer a senha -->
                </form>
            </div>
        </section>
    </main>

    <em>link</em>

</body>
</html>
